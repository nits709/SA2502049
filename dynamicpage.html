<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Stock Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .dashboard-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
      width: 300px;
      margin: 15px;
      text-align: center;
    }

    .stock-name {
      font-size: 1.4rem;
      color: #333;
    }

    .stock-price {
      font-size: 2rem;
      font-weight: bold;
      transition: color 0.5s ease;
    }

    .status {
      font-size: 1.2rem;
      margin-top: 10px;
    }

    .rating {
      font-size: 1.8rem;
      color: #28a745;
    }

    .up {
      color: #28a745;
    }

    .down {
      color: #dc3545;
    }

    .neutral {
      color: #6c757d;
    }
  </style>
</head>
<body>

  <div class="dashboard-card" id="priceCard">
    <div class="stock-name">XYZ Corp (XYZ)</div>
    <div id="price" class="stock-price">$100.00</div>
    <div id="priceStatus" class="status">Price is stable.</div>
  </div>

  <div class="dashboard-card" id="statusCard">
    <div class="stock-name">Company Status</div>
    <div id="status" class="status">Active</div>
  </div>

  <div class="dashboard-card" id="ratingCard">
    <div class="stock-name">Customer Rating</div>
    <div id="rating" class="rating">4.5 / 5</div>
  </div>

  <script>
    let currentPrice = 100.00;
    let currentRating = 4.5;

    function getRandomChange() {
      return (Math.random() * 2 - 1).toFixed(2); // Random change between -1 and +1
    }

    function updatePrice() {
      const change = parseFloat(getRandomChange());
      const newPrice = (currentPrice + change).toFixed(2);
      const priceEl = document.getElementById("price");
      const statusEl = document.getElementById("priceStatus");

      priceEl.classList.remove("up", "down");

      if (change > 0) {
        priceEl.classList.add("up");
        statusEl.textContent = "Price is rising!";
      } else if (change < 0) {
        priceEl.classList.add("down");
        statusEl.textContent = "Price is dropping!";
      } else {
        statusEl.textContent = "Price is stable.";
      }

      priceEl.textContent = `$${newPrice}`;
      currentPrice = parseFloat(newPrice);
    }

    function updateStatus() {
      const statuses = ["Active", "Suspended", "Under Review", "Acquiring"];
      const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
      document.getElementById("status").textContent = randomStatus;
    }

    function updateRating() {
      const change = (Math.random() * 0.2 - 0.1).toFixed(1); // Random change between -0.1 and +0.1
      let newRating = (currentRating + parseFloat(change)).toFixed(1);

      // Ensure rating stays between 1 and 5
      if (newRating > 5) newRating = 5;
      if (newRating < 1) newRating = 1;

      const ratingEl = document.getElementById("rating");
      ratingEl.textContent = `${newRating} / 5`;

      if (change > 0) {
        ratingEl.classList.add("up");
        ratingEl.classList.remove("down", "neutral");
      } else if (change < 0) {
        ratingEl.classList.add("down");
        ratingEl.classList.remove("up", "neutral");
      } else {
        ratingEl.classList.add("neutral");
        ratingEl.classList.remove("up", "down");
      }

      currentRating = parseFloat(newRating);
    }

    // Set up intervals
    setInterval(updatePrice, 5000); // Update stock price every 5 seconds
    setInterval(updateStatus, 2000); // Update company status every 2 seconds
    setInterval(updateRating, 2000); // Update customer rating every 2 seconds

    // Initial calls
    updatePrice();
    updateStatus();
    updateRating();
  </script>

</body>
</html>
